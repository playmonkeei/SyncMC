name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · tests & build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Check tracked files before publication
        run: node scripts/check-publication.mjs --all
      - name: Verify the GLib security backport source and Cargo patch
        run: npm run check:glib-backport
      - name: Install dependencies
        run: npm ci
      - name: Test profile sync, catalog & Minecraft versions
        run: node --experimental-strip-types --test tests/*.test.ts
      - name: Build production frontend
        run: npm run build

  native:
    name: Rust · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Standard Intel runner avoids the ARM64 allocation bottleneck.
        os: [ubuntu-24.04, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      # Cargo reads the pinned toolchain from rust-toolchain.toml.
      # Ignored tests download Minecraft/Java and stay opt-in for local testing.
      - name: Test native core with the locked dependency graph
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Test GLib string iterator backport with optimizations
        if: runner.os == 'Linux'
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml -p syncmc-glib-regression
