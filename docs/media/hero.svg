<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">SyncMC — Dein Minecraft. Dein Setup.</title>
  <desc id="desc">Mintgrüner SyncMC-Schriftzug auf dunklem Waldgrün mit einer abstrakten Landschaft aus Würfeln.</desc>
