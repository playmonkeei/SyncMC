    <text x="60" y="193" fill="#edf4e8" font-size="94" font-weight="750" letter-spacing="-6">Sync<tspan fill="#d8edaa">MC</tspan></text>
    <text x="64" y="246" fill="#edf4e8" font-size="27" font-weight="500" letter-spacing="-.7">Dein Minecraft. Dein Setup.</text>
