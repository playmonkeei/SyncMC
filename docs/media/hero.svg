    <radialGradient id="glow"><stop stop-color="#a4cf7b" stop-opacity=".2"/><stop offset="1" stop-color="#a4cf7b" stop-opacity="0"/></radialGradient>
    <linearGradient id="top" x2="1" y2="1"><stop stop-color="#d8edaa"/><stop offset="1" stop-color="#a5cc7e"/></linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#cce8ae" stroke-opacity=".045"/></pattern>
